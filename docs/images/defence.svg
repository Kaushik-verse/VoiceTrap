<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">The VoiceTrap Shield: three layers</title>
  <desc id="d">Layer 1, a speaker gate, mutes voices that are not the enrolled owner before transcription. Layer 2 blocks high-risk actions whose details the owner never said. Layer 3 asks the owner to confirm high-risk actions on screen.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9A9EA3"/></marker></defs>
  <rect width="1280" height="360" rx="22" fill="#F7F6F2"/>
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="48" y="54" font-family="Georgia,serif" font-size="24" fill="#1A1C1E">The shield: check who spoke, not just what was said</text>
    <text x="48" y="80" font-size="14" fill="#5E6368">Text filters can't tell an ad from the owner. Each layer catches what the one before it lets through.</text>

    <g stroke="#9A9EA3" stroke-width="1.6" fill="none">
      <path d="M200 196H236" marker-end="url(#a)"/><path d="M546 196H582" marker-end="url(#a)"/>
      <path d="M892 196H928" marker-end="url(#a)"/>
    </g>

    <g text-anchor="middle">
      <rect x="48" y="150" width="152" height="92" rx="12" fill="#fff" stroke="#E2DFD6"/>
      <text x="124" y="190" font-size="15" font-weight="700" fill="#1A1C1E">Microphone</text>
      <text x="124" y="212" font-size="12.5" fill="#5E6368">owner + TV + ads</text>
    </g>

    <g>
      <rect x="238" y="116" width="308" height="160" rx="14" fill="#fff" stroke="#1E4D8C" stroke-width="1.5"/>
      <text x="262" y="148" font-size="12" font-weight="700" fill="#1E4D8C" letter-spacing="1.3">LAYER 1 · BEFORE TRANSCRIPTION</text>
      <text x="262" y="178" font-size="17" font-weight="700" fill="#1A1C1E">Speaker gate</text>
      <text x="262" y="204" font-size="13" fill="#5E6368">Pretrained ECAPA voiceprint. Audio that</text>
      <text x="262" y="222" font-size="13" fill="#5E6368">doesn't sound like the enrolled owner is</text>
      <text x="262" y="240" font-size="13" fill="#5E6368">muted before Whisper ever hears it.</text>
      <text x="262" y="262" font-size="12" fill="#8A8F94">stops: other voices, TV, ads</text>
    </g>
    <g>
      <rect x="584" y="116" width="308" height="160" rx="14" fill="#fff" stroke="#1E4D8C" stroke-width="1.5"/>
      <text x="608" y="148" font-size="12" font-weight="700" fill="#1E4D8C" letter-spacing="1.3">LAYER 2 · BEFORE ACTING</text>
      <text x="608" y="178" font-size="17" font-weight="700" fill="#1A1C1E">Grounding check</text>
      <text x="608" y="204" font-size="13" fill="#5E6368">Money, messages and the door lock only</text>
      <text x="608" y="222" font-size="13" fill="#5E6368">run if the amount and recipient were in</text>
      <text x="608" y="240" font-size="13" fill="#5E6368">the owner's own words.</text>
      <text x="608" y="262" font-size="12" fill="#8A8F94">stops: invented or leaked details</text>
    </g>
    <g>
      <rect x="930" y="116" width="302" height="160" rx="14" fill="#fff" stroke="#1E4D8C" stroke-width="1.5"/>
      <text x="954" y="148" font-size="12" font-weight="700" fill="#1E4D8C" letter-spacing="1.3">LAYER 3 · LAST WORD</text>
      <text x="954" y="178" font-size="17" font-weight="700" fill="#1A1C1E">Owner confirms</text>
      <text x="954" y="204" font-size="13" fill="#5E6368">High-risk actions wait for a tap on</text>
      <text x="954" y="222" font-size="13" fill="#5E6368">the owner's phone. A cloned voice</text>
      <text x="954" y="240" font-size="13" fill="#5E6368">can't tap a screen.</text>
      <text x="954" y="262" font-size="12" fill="#8A8F94">stops: similar and cloned voices</text>
    </g>
    <text x="48" y="320" font-size="13" fill="#5E6368">Low-risk actions (alarms, music, weather) skip layers 2 and 3, so everyday use stays hands-free.</text>
  </g>
</svg>
