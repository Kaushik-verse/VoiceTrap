[project]
name = "voicetrap"
version = "0.1.0"
description = "Hidden voice commands that hijack voice AI agents, and a layered defence against them."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ch Kaushik" }]
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "soundfile>=0.12",
  "python-dotenv>=1.0",
  "scikit-learn>=1.9.1",
]

[project.optional-dependencies]
speaker = ["speechbrain>=1.0", "torch>=2.2", "torchaudio>=2.2"]
app = [
    "altair>=5",
    "pandas>=2",
    "streamlit>=1.40",
]

[project.scripts]
voicetrap = "voicetrap.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicetrap"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
per-file-ignores = { "colab/*" = ["E402"] }  # notebook cells import where they are used
